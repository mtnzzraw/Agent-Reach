# Calendario de publicaciones (fuente de plan.py). Sale de plan/plan-30-dias-lia.md.
# format: carousel (2-10 escenas, 4:5) | reel (1 escena, 9:16 + vídeo de 6 s con el gancho encima)
# hook: primera línea del pie de foto y texto en pantalla del Reel / primera foto
# scenes: van en inglés, solo al prompt de la imagen. El pie de foto se escribe en español.
# verify: true -> nombra sitios, precios u horarios reales: revísalo a mano antes de publicar.
# time: opcional, por defecto persona.yaml -> post_time

